topic:
  name: "3D CT Lung Nodule Detection"

  arxiv_query: >
    (all:"lung nodule"
    OR all:"pulmonary nodule"
    OR all:"LNDb"
    OR all:"LUNA16")
    AND
    (all:"deep learning"
    OR all:"computed tomography")

  categories:
    - "cs.CV"
    - "eess.IV"


schedule:
  run_every_days: 3
  lookback_days: 5


retrieval:
  max_candidates: 40
  max_papers: 8

relevance:
  min_score: 7
  high_score: 10

  core_terms:
    - "lung nodule"
    - "pulmonary nodule"
    - "LUNA16"
    - "LNDb"

  target_terms:
    - "detection"
    - "detector"
    - "false positive"
    - "false-positive"
    - "false positive reduction"
    - "false-positive reduction"
    - "candidate generation"
    - "candidate detection"
    - "candidate classification"
    - "computer-aided detection"
    - "computer aided detection"

  supporting_terms:
    - "computed tomography"
    - "CT"
    - "3D"
    - "deep learning"

  deprioritize_terms:
    - "segmentation"
    - "malignancy"
    - "characterization"
    - "triage"
    - "vision-language model"
    - "vision language model"
    - "clinical decision making"
output:
  language: "zh-CN"
  reports_dir: "reports"


state:
  file: ".state/state.json"