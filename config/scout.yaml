topic:
  name: "3D CT Lung Nodule Detection"

  arxiv_query: >
    (all:"lung nodule"
    OR all:"pulmonary nodule"
    OR all:"lung cancer screening"
    OR all:"LIDC"
    OR all:"LNDb"
    OR all:"LUNA16"
    OR all:"NODE21"
    OR all:"NLST")
    AND
    (all:"deep learning"
    OR all:"computed tomography")

  categories:
    - "cs.CV"
    - "eess.IV"
    - "cs.LG"


# --------------------------------------------------
# Retrieval sources
#
# Sources are queried in the order listed here and
# their results concatenated. Deduplication keeps the
# first occurrence, so arXiv comes first: a preprint
# usually has a downloadable PDF, while the journal
# version of the same work often does not, and a full
# text produces a far stronger analysis than an
# abstract.
#
# Each source keeps its own query, because their query
# languages differ and translating between them loses
# precision.
# --------------------------------------------------

sources:
  arxiv:
    enabled: true
    # Query, categories and max_candidates for arXiv
    # live in topic: and retrieval: below.

  europepmc:
    enabled: true

    # Europe PMC covers the medical imaging journals
    # where this field actually publishes, which arXiv
    # does not index at all.
    #
    # Its query language is not arXiv's: fields are
    # named (TITLE_ABS, AUTH, JOURNAL), and the
    # publication window is added automatically from
    # schedule.lookback_days.
    max_candidates: 50

    query: >
      (TITLE_ABS:"lung nodule"
      OR TITLE_ABS:"pulmonary nodule"
      OR TITLE_ABS:"LUNA16"
      OR TITLE_ABS:"LNDb"
      OR TITLE_ABS:"NODE21"
      OR TITLE_ABS:"LIDC"
      OR TITLE_ABS:"lung cancer screening")
      AND
      (TITLE_ABS:"deep learning"
      OR TITLE_ABS:"computed tomography")


schedule:
  run_every_days: 3

  # Static floor for the publication window.
  #
  # The observed publication rate for this topic is
  # roughly 2-3 papers per month, so a 5-day window
  # returned zero papers on every automated run.
  #
  # runner.py additionally widens this window when a
  # previous scheduled run failed, so that papers are
  # never skipped permanently.
  lookback_days: 14


retrieval:
  # Must be large enough to cover lookback_days worth
  # of submissions, because the arXiv response is
  # truncated at this value before date filtering.
  max_candidates: 100
  max_papers: 8

pdf:
  max_download_mb: 50
  max_text_chars: 70000
  timeout_seconds: 90
  max_attempts: 3

llm:
  default_provider: "deepseek"

  max_context_chars: 45000
  max_output_tokens: 2500

  openai:
    model: "gpt-5.6-terra"

  deepseek:
    model: "deepseek-v4-pro"
    base_url: "https://api.deepseek.com"

relevance:
  # Admission is governed by require_core, not by a
  # high threshold. min_score only removes papers that
  # mention the topic in passing.
  min_score: 4
  high_score: 8

  # A paper must match at least one core term to enter
  # the candidate set. This replaces the previous
  # behaviour where deprioritize_terms could veto an
  # otherwise on-topic paper.
  require_core: true

  # Core terms are the topic gate, so they must be
  # specific to lung nodules. Dataset names that are
  # widely reused outside this topic (LIDC, NLST) are
  # supporting signals instead: a low-dose CT denoising
  # paper that merely simulates on LIDC-IDRI is not a
  # nodule paper.
  core_terms:
    - "lung nodule"
    - "pulmonary nodule"
    - "LUNA16"
    - "LNDb"
    - "NODE21"

  target_terms:
    - "detection"
    - "detector"
    - "false positive"
    - "false-positive"
    - "false positive reduction"
    - "false-positive reduction"
    - "candidate generation"
    - "candidate detection"
    - "candidate classification"
    - "computer-aided detection"
    - "computer aided detection"

  supporting_terms:
    - "computed tomography"
    - "CT"
    - "3D"
    - "deep learning"
    # "LIDC" also matches "LIDC-IDRI", because
    # contains_term() treats "-" as a word boundary.
    - "LIDC"
    - "NLST"
    - "lung cancer screening"
    - "low-dose CT"
    - "LDCT"

  # These now only push a paper down the ranking.
  # They can no longer exclude it.
  deprioritize_terms:
    - "segmentation"
    - "malignancy"
    - "characterization"
    - "triage"
    - "vision-language model"
    - "vision language model"
    - "clinical decision making"

output:
  language: "zh-CN"
  reports_dir: "reports"


state:
  file: ".state/state.json"
