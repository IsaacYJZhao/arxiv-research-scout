[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"


[project]
name = "arxiv-research-scout"
version = "0.1.0"
description = "Monitor arXiv research topics and generate structured literature digests."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "MIT"

authors = [
    { name = "Yijian Zhao" }
]

dependencies = [
    "requests>=2.32,<3",
    "PyYAML>=6,<7",
    "pypdf>=5,<7",
    "openai>=3,<4",
]

[project.scripts]
arxiv-scout = "arxiv_research_scout.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
]


[tool.setuptools.packages.find]
where = ["src"]


[tool.pytest.ini_options]
testpaths = ["tests"]