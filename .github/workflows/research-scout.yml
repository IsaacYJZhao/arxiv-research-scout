name: arXiv Research Scout

on:
  workflow_dispatch:

  schedule:
    # GitHub Actions cron uses UTC.
    # Wake up once every day at 08:17 UTC.
    # The Python application itself decides whether
    # run_every_days has elapsed.
    - cron: "17 8 * * *"

permissions:
  contents: write

concurrency:
  group: arxiv-research-scout
  cancel-in-progress: false

jobs:
  research-scout:
    name: Run research scout
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install project
        run: python -m pip install -e ".[dev]"

      - name: Run test suite
        run: python -m pytest

      - name: Run research scout
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: arxiv-scout run

      - name: Commit generated reports and state
        shell: bash
        run: |
          if [[ -z "$(git status --porcelain)" ]]; then
            echo "No generated changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .state/state.json reports/

          if git diff --cached --quiet; then
            echo "No tracked research output changed."
            exit 0
          fi

          git commit -m "Update arXiv research scout results"

          # Incorporate any commit that may have reached
          # main while this workflow was running.
          git pull --rebase origin main

          git push origin main